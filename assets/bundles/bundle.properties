item.grounded-industry-iron-ore.name = Iron Ore
item.grounded-industry-iron-ore.description = Iron-bearing rock. Concentrate it before smelting.
item.grounded-industry-iron-concentrate.name = Iron Concentrate
item.grounded-industry-iron-concentrate.description = Magnetite separated from sand or washed out of crushed ore.
item.grounded-industry-coke.name = Coke
item.grounded-industry-coke.description = Coal baked free of impurities. Fuel and reducing agent for iron smelting.
item.grounded-industry-sinter.name = Sinter
item.grounded-industry-sinter.description = Iron concentrate fused with coke into lumps that a blast furnace can use.
item.grounded-industry-pig-iron.name = Pig Iron
item.grounded-industry-pig-iron.description = Brittle, high-carbon iron straight from the blast furnace. Refine it into steel.
item.grounded-industry-steel.name = Steel
item.grounded-industry-steel.description = Strong, tough structural metal.
block.grounded-industry-ore-iron.name = Iron Ore
block.grounded-industry-magnetic-separator.name = Magnetic Separator
block.grounded-industry-magnetic-separator.description = Pulls magnetite out of ordinary sand. Slow, but sand is everywhere.
block.grounded-industry-ore-concentrator.name = Ore Concentrator
block.grounded-industry-ore-concentrator.description = Crushes and washes iron ore into concentrate, leaving sand tailings.
block.grounded-industry-coke-oven.name = Coke Oven
block.grounded-industry-coke-oven.description = Bakes coal into coke. Runs hot.
block.grounded-industry-sinter-plant.name = Sinter Plant
block.grounded-industry-sinter-plant.description = Fuses iron concentrate and coke into sinter.
block.grounded-industry-blast-furnace.name = Blast Furnace
block.grounded-industry-blast-furnace.description = Smelts sinter with coke and a sand flux into pig iron. Gives off molten slag that must be piped away, or the furnace stops. Runs very hot; feed it water.
block.grounded-industry-arc-furnace.name = Electric Arc Furnace
block.grounded-industry-arc-furnace.description = Refines pig iron and scrap into steel using a huge amount of power. Runs very hot.
block.grounded-industry-steel-wall.name = Steel Wall
block.grounded-industry-steel-wall.description = A tough, well-armored wall.
block.grounded-industry-steel-wall-large.name = Large Steel Wall
block.grounded-industry-steel-wall-large.description = A tough, well-armored wall. Spans multiple tiles.
block.grounded-industry-transmission-tower.name = Transmission Tower
block.grounded-industry-transmission-tower.description = A high-voltage line. Reaches 30 tiles and loses only a quarter of the usual line loss.

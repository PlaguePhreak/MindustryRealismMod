planet.grounded-industry-halden.name = Halden
planet.grounded-industry-halden.description = A temperate world of rivers, coal basins and rust-red iron hills. Warm at the equator and frozen at the poles: machines run hotter and power lines lose more in the south, while polar sectors cool machines for free but thicken water in long pipelines and slow cold generator starts.
